<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Box</title>
    <script>
      // Aplica el tema guardado antes de que cargue React, para evitar un parpadeo.
      try {
        const guardado = JSON.parse(localStorage.getItem('recetario:tema'));
        const oscuro = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = guardado ?? (oscuro ? 'oscuro' : 'claro');
      } catch {
        // Sin acceso a localStorage: se queda el tema claro hasta que cargue React.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
